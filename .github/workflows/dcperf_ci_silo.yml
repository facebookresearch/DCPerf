# This workflow is used for DCPerf CI.
name: DCPerf Silo CI

on:
  # PR Trigger — only run when files affecting this benchmark change
  #
  pull_request:
    paths:
      - 'packages/silo/**'
      - 'benchpress/config/benchmarks_mem.yml'
      - 'benchpress/config/jobs_mem.yml'
      - 'benchpress/plugins/parsers/silo.py'
      - '.github/scripts/dcperf_install_silo.bash'
      - '.github/scripts/setup_env.bash'
      - '.github/workflows/dcperf_ci_silo.yml'
      - 'scripts/install-deps.sh'

  # Push Trigger (enable to catch errors coming out of multiple merges)
  #
  push:
    branches:
      - main
    paths:
      - 'packages/silo/**'
      - 'benchpress/config/benchmarks_mem.yml'
      - 'benchpress/config/jobs_mem.yml'
      - 'benchpress/plugins/parsers/silo.py'
      - '.github/scripts/dcperf_install_silo.bash'
      - '.github/scripts/setup_env.bash'
      - '.github/workflows/dcperf_ci_silo.yml'
      - 'scripts/install-deps.sh'

  # Manual Trigger
  #
  workflow_dispatch:

concurrency:
  # Cancel previous runs in the PR if a new commit is pushed
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build on CPU hosts (generic GitHub runners)
  build_artifact:
    runs-on: ${{ matrix.host-machine.instance }}
    container:
      image: ${{ matrix.host-machine.container }}
      options: --user root --privileged --pid=host
      volumes:
          - /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        shell: bash
    env:
      PRELUDE: .github/scripts/setup_env.bash
      BUILD_ENV: build_env
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        # CentOS only: Silo's install script is dnf-based and Ubuntu
        # support is untested. Both arches are covered: the AArch64
        # jobs exercise the AArch64 patch path, the x86 jobs the
        # guarded x86 path.
        host-machine: [
          { arch: x86, instance: "ubuntu-latest", container: "quay.io/centos/centos:stream9", type: "centos" },
          { arch: aarch64, instance: "ubuntu-24.04-arm", container: "quay.io/centos/centos:stream9", type: "centos" },
          { arch: x86, instance: "ubuntu-latest", container: "quay.io/centos/centos:stream10", type: "centos" },
          { arch: aarch64, instance: "ubuntu-24.04-arm", container: "quay.io/centos/centos:stream10", type: "centos" },

        ]
        python-version: [ "3.12" ]
    steps:
    - name: Setup Build Container (centos-based)
      run: dnf update -y; dnf install -y git pciutils which dmidecode

    - name: Checkout the Repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Free Disk Space on Host
      run: . $PRELUDE; free_disk_space_on_host

    - name: Display System Info
      run: . $PRELUDE; print_system_info

    - name: Install Build Tools
      run: . $PRELUDE; install_build_tools

    - name: Setup Miniconda
      run: . $PRELUDE; setup_miniconda $HOME/miniconda

    - name: Create Conda Environment
      run: . $PRELUDE; create_conda_environment $BUILD_ENV ${{ matrix.python-version }}

    - name: Install Python Tools
      run: . $PRELUDE; install_python_tools $BUILD_ENV

    - name: Install Silo
      run: . $PRELUDE; install_silo $BUILD_ENV
      continue-on-error: false

    - name: Run Silo Smoke Test
      run: . $PRELUDE; run_silo_smoke_test $BUILD_ENV
      continue-on-error: false
