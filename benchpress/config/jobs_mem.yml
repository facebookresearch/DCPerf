- benchmark: xsbench # (required) Name of the benchmark, matches name in benchmarks.yml
  name: xsbench # https://github.com/ANL-CESAR/XSBench
  description: XSBench is a mini-app representing a key computational kernel of the Monte Carlo neutron transport algorithm. # (required) Description of configuration
  args: # (dictionary format) arguments to be passed as CLI options to the benchmmark as --<key> <value>
    - '-t {thread_cnt}'
    - '-p {history}'
    #- '-s {size}'
    #- '-g {gridpoints}'
  vars:
    - "thread_cnt=16"
    - "history=500000"
    #- "size=Large" # XL 120GB, XXL 225GB
    #- "gridpoints=11303"

# GAPBS jobs - default to a synthetic Kronecker graph (-g {scale}, 2^scale
# vertices, ~16 avg degree) so the job is self-contained and avoids the
# multi-GB twitter download. The graph and trials are exposed as `vars` so
# they can be tuned per run by editing the values below.
#
# Default scale=25 -> 2^25 ≈ 33M vertices, ~530M edges, ~4-8 GB CSR
# footprint (more for sssp/pr which keep additional per-vertex state).
# Bump scale to 27-28 for >32 GB working sets; each +1 in scale roughly
# doubles memory. To run against a pre-built real-world graph instead,
# replace the args block with e.g.:
#   args:
#     - -f ./benchmarks/graphs/twitter.sg
#     - -n {trials}
- benchmark: gapbs_bc
  name: gapbs_bc
  description: GAP bc benchmark (betweenness centrality) on a synthetic Kronecker graph
  args:
    - -g {scale}
    - -n {trials}
  vars:
    - "scale=25"
    - "trials=3"

- benchmark: gapbs_bfs
  name: gapbs_bfs
  description: GAP bfs benchmark on a synthetic Kronecker graph
  args:
    - -g {scale}
    - -n {trials}
  vars:
    - "scale=25"
    - "trials=3"

- benchmark: gapbs_cc
  name: gapbs_cc
  description: GAP cc benchmark (connected components) on a synthetic Kronecker graph
  args:
    - -g {scale}
    - -n {trials}
  vars:
    - "scale=25"
    - "trials=3"

- benchmark: gapbs_tc
  name: gapbs_tc
  description: GAP tc benchmark (triangle count, requires undirected graph; -g auto-undirects)
  args:
    - -g {scale}
    - -n {trials}
  vars:
    - "scale=25"
    - "trials=3"

- benchmark: gapbs_pr
  name: gapbs_pr
  description: GAP pr benchmark (PageRank) on a synthetic Kronecker graph
  args:
    - -g {scale}
    - -n {trials}
  vars:
    - "scale=25"
    - "trials=3"

- benchmark: gapbs_sssp
  name: gapbs_sssp
  description: GAP sssp benchmark on a synthetic Kronecker graph
  args:
    - -g {scale}
    - -n {trials}
  vars:
    - "scale=25"
    - "trials=3"

# Multi-instance GAPBS on a PRE-BUILT graph. Launches {num_instances} core-pinned
# gapbs instances of {bench}, each in its own systemd-run cgroup scope with
# per-instance memory.low/high/max limits, then aggregates each instance's
# Average Time (mean/min/max).
#
# Requirements / notes:
#   * The graph must already exist. Build it once with:
#       ./benchmarks/gapbs/generate_graph.sh -g 30 -k 33
#     (generates kronecker30_k33.sg; ~350 GB, needs >=500 GB free.)
#   * Per-instance memory limits require running benchpress as root; without
#     root the runner falls back to taskset pinning WITHOUT memory limits.
#   * mem_low/high/max accept human suffixes (e.g. 290G) or 'max' (unlimited).
#   * Core layout counts PHYSICAL cores; SMT siblings are auto-added to the
#     reserved cpuset. The kernel runs on threads_per_instance cores.
#   * bench is one of: bc bfs cc pr sssp tc. graph_file is a base name (no
#     extension) resolved per kernel: bc/bfs/cc/pr->.sg, sssp->.wsg, tc->U.sg.
- benchmark: gapbs_multi
  name: gapbs_multi
  description: >
    Multi-instance GAP benchmark. Launches {num_instances} core-pinned gapbs
    instances, each in a systemd-run cgroup scope with per-instance
    memory.low/high/max limits, on a pre-built graph. Aggregates per-instance
    Average Time (mean/min/max).
  args:
    - '-n {num_instances}'
    - '-b {bench}'
    - '-f {graph_file}'
    - '-t {trials}'
    - '--core-start {core_start}'
    - '-c {cores_per_instance}'
    - '--core-stride {core_stride}'
    - '-T {threads_per_instance}'
    - '--mem-low {mem_low}'
    - '--mem-high {mem_high}'
    - '--mem-max {mem_max}'
    - '{extra_args}'
  vars:
    - "num_instances=3"
    - "bench=bc"
    - "graph_file=kronecker30_k33"
    - "trials=2"
    - "core_start=0"
    - "cores_per_instance=32"
    - "core_stride=32"
    - "threads_per_instance=16"
    - "mem_low=290G"
    - "mem_high=300G"
    - "mem_max=310G"
    # extra_args is passed verbatim, e.g. "--ccx" to bind each instance to an
    # auto-detected CCX (sysfs L3 domain), "--mem-nodes 0,1" for DRAM+CXL, or
    # "--no-cgroup" to disable scopes/limits (taskset-only).
    - "extra_args="

- benchmark: liblinear_multi
  name: liblinear_multi
  description: >
    Multi-instance liblinear (multicore). Launches {num_instances} core-pinned
    `train -m {threads_per_instance}` instances, each in a systemd-run cgroup
    scope with per-instance memory.low/high/max limits, on a PRE-BUILT LIBSVM
    dataset (build with packages/liblinear/generate_dataset.sh). Aggregates
    per-instance train time (mean/min/max). Capacity/perf workload: model is
    written to /dev/null, no predict step.
  args:
    - '-n {num_instances}'
    - '-f {dataset}'
    - '--solver {solver}'
    - '--cost {cost}'
    - '--bias {bias}'
    - '--core-start {core_start}'
    - '-c {cores_per_instance}'
    - '--core-stride {core_stride}'
    - '-T {threads_per_instance}'
    - '--mem-low {mem_low}'
    - '--mem-high {mem_high}'
    - '--mem-max {mem_max}'
    - '{extra_args}'
  vars:
    - "num_instances=4"
    # Pre-built dataset basename under ./packages/liblinear/datasets (or an
    # absolute .svm path). This default matches generate_dataset.sh defaults
    # (--target-gib 190 -k 200 -n 2000000 --mode varied); build it first.
    - "dataset=synth_varied_k200_n2000000_l63092187.svm"
    - "solver=6"          # -s 6 = L1R_LR (transposes data ~2x resident)
    - "cost=1"
    - "bias=-1"           # -B only applied when >= 0
    - "core_start=0"
    - "cores_per_instance=32"
    - "core_stride=32"
    - "threads_per_instance=16"
    - "mem_low=390G"
    - "mem_high=395G"
    - "mem_max=400G"
    # extra_args is passed verbatim, e.g. "--eps 0.01", "--ccx",
    # "--mem-nodes 0,1" (DRAM+CXL), or "--no-cgroup" (taskset-only, no limits).
    - "extra_args="

- benchmark: silo
  name: silo_default
  description: defaults for silo
  args:
    verbose: true
    bench: tpcc
    num-threads: 1
    scale-factor: 1
    runtime: 1

# ---------------------------------------------------------------------------
# Silo TPC-C jobs. Silo recommends one warehouse per worker thread for good
# behavior, so scale-factor mostly tracks num-threads.
# ---------------------------------------------------------------------------

- benchmark: silo
  name: silo_tpcc_1t
  description: Silo TPC-C, single-threaded, 30s run (baseline)
  args:
    - '--verbose'
    - 'true'
    - '--bench'
    - 'tpcc'
    - '--num-threads'
    - '{num_threads}'
    - '--scale-factor'
    - '{scale_factor}'
    - '--runtime'
    - '{runtime}'
  vars:
    - 'num_threads=1'
    - 'scale_factor=1'
    - 'runtime=30'

- benchmark: silo
  name: silo_tpcc_allcores
  description: Silo TPC-C across all cores (num-threads 0 is rewritten to $(nproc) by run.sh), 30s
  args:
    - '--verbose'
    - 'true'
    - '--bench'
    - 'tpcc'
    - '--num-threads'
    - '{num_threads}'
    - '--scale-factor'
    - '{scale_factor}'
    - '--runtime'
    - '{runtime}'
  vars:
    - 'num_threads=0'
    - 'scale_factor=32'
    - 'runtime=30'

