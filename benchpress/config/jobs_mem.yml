# ---------------------------------------------------------------------------
# Silo microbenchmark: the `queue` workload is dbtest's simplest enqueue/
# dequeue test, useful as a pure key-value get/put stressor.
# ---------------------------------------------------------------------------

- benchmark: silo
  name: silo_queue
  description: Silo `queue` microbenchmark (simple KV insert/delete), all cores, 30s
  args:
    - '--verbose'
    - 'true'
    - '--bench'
    - 'queue'
    - '--num-threads'
    - '{num_threads}'
    - '--scale-factor'
    - '{scale_factor}'
    - '--runtime'
    - '{runtime}'
  vars:
    - 'num_threads=0'
    - 'scale_factor=1'
    - 'runtime=30'

