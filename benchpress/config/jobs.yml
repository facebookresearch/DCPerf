    - '-d {fixed_qps_duration}'
    - '-w {warmup_time}'
    - '-r {qps_percentage_threshold}'
    - '-x {max_warmup_iterations}'
    - '-D {queue_drain_time}'
    - '-R {node_rank_seed}'
    - '-P {page_rank_seed}'
    - '-C {pointer_chase_seed}'
