    # calls/req previously gave only 1.7-1.9%.
    - 'num_stories=1800'
    - 'extractors_per_story=50'
    - 'fixed_qps=100000'
    - 'fixed_qps_duration=10'
    - 'warmup_time=5'
    - 'qps_percentage_threshold=-1'
    - 'max_warmup_iterations=-1'
    - 'queue_drain_time=1'
    - 'node_rank_seed=54321'
    - 'page_rank_seed=12345'
    - 'pointer_chase_seed=98765'
    # t43 c7 mock_services + TLS knobs (same baseline as feedsim_autoscale_dlrm)
    - 'mock_tls=1'
    - 'mock_zstd_frac=0.75'
    - 'mock_keepalive_interval_ms=200'
    - 'rpc_fanout_scale=0.05'
    - 'server_zstd=0'
    - 'sla_p95_ms=700'
    - 'extra_args='
  hooks:
    - hook: copymove
      options:
        is_move: true
        after:
          - 'benchmarks/feedsim/feedsim_results*.txt'
          - 'benchmarks/feedsim/feedsim-multi-inst-*.log'
          - 'benchmarks/feedsim/src/perf.data'
          - 'benchmarks/feedsim/breakdown.csv'
          - '/tmp/feedsim_log.txt'

