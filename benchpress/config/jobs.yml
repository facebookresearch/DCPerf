- benchmark: django_workload
  name: django_workload_default
  description: Default run for django-workload
  tee_output: true
  roles:
    clientserver:
      args:
        - '-r clientserver'
        - '-d {duration}'
        - '-i {iterations}'
        - '-p {reps}'
        - '-l ./siege.log'
        - '-s urls.txt'
        - '-c {db_addr}'
        - '--interpreter {interpreter}'
        - '--use-async {use_async}'
        - '--base-port {base_port}'
        - '-T {stats_port}'
        - '--use-jit {use_jit}'
        - '--skip-datagen {skip_datagen}'
      vars:
        - 'db_addr'
        - 'duration=5M'
        - 'iterations=7'
        - 'reps=0'
        - 'interpreter=cinder'
        - 'use_async=1'
        - 'base_port=16668'
        - 'stats_port=8001'
        - 'use_jit=1'
        - 'skip_datagen=0'
    db:
      args:
        - '-r db'
        - '-b {bind_ip}'
