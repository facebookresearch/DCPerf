    - '--'
    - '--test bandwidth'
    - '{extra_args}'
  vars:
    - 'extra_args='

- benchmark: health_check
  name: mm_mem_idle_latency
  description: Run mm-mem idle latency benchmark
  args:
    - '-b mm-mem'
    - '--'
    - '--test idle_latency'
    - '{extra_args}'
  vars:
    - 'extra_args='

- benchmark: health_check
  name: mm_mem_loaded_latency
  description: Run mm-mem loaded latency benchmark
  args:
    - '-b mm-mem'
    - '--'
    - '--test loaded_latency'
    - '{extra_args}'
  vars:
    - 'extra_args='

- benchmark: sleep
  name: sleep
  description: >
    Sleep for a period of time. Can be used to leverage Benchpress's Perf
    Monitoring Hook to monitor some external workloads.
  args:
    - '{duration}'
  vars:
    - 'duration'

- benchmark: graph500_omp_csr
  name: graph500_omp_csr
  description: >
    Graph500 v3 reference BFS (MPI). Single positional arg is SCALE (log2
    vertices); run.sh wraps the binary with mpirun -np <largest pow2 <= nproc>.
    SCALE defaults to 20 and can be overridden per-run from the CLI, e.g.
    `./benchpress run graph500_omp_csr --role_input='{"scale":"25"}'`.
  args:
    - "{scale}"
  vars:
    - "scale=20"

- benchmark: liblinear
  name: liblinear_synthetic
  description: >
    liblinear training + prediction on a synthetic arbitrary-size LIBSVM
    dataset. Size/shape are overridable, e.g.
    `./benchpress run liblinear_synthetic -i '{"samples": "500000"}'`.
  args:
    dataset: synthetic
    samples: "{samples}"
    features: "{features}"
    density: "{density}"
    noise: "{noise}"
    seed: "{seed}"
    solver: "{solver}"
    cost: "{cost}"
    bias: "{bias}"
  vars:
    - 'samples=200000'
    - 'features=1000'
    - 'density=0.1'
    - 'noise=0.0'
    - 'seed=42'
    - 'solver=1'
    - 'cost=1'
    - 'bias=1'
  hooks: []

- benchmark: liblinear
  name: liblinear_rcv1
  description: liblinear training + prediction on the real rcv1.binary dataset
  args:
    dataset: rcv1
    solver: 1
    cost: 1
  hooks: []
